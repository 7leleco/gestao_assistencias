<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Assistências</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <h1>Assistências</h1>

    <button>+ Nova OS</button>

    <div class="cards">
        <div class="card">
            <span class="card-label">ASSISTÊNCIAS NO PERÍODO</span>
            <strong class="card-valor">0</strong>
            <span class="card-foot">Total geral</span>
        </div>

        <div class="card">
            <span class="card-label">NOTAS FEITAS</span>
            <strong class="card-valor">0</strong>
            <span class="card-foot">Marcadas com OK</span>
        </div>

        <div class="card">
            <span class="card-label">NOTAS PENDENTES</span>
            <strong class="card-valor">0</strong>
            <span class="card-foot">Precisam de atenção</span>
        </div>

        <div class="card">
            <span class="card-label">VALOR TOTAL</span>
            <strong class="card-valor">R$ 0</strong>
            <span class="card-foot">Visita + MDO + peças</span>
        </div>
    </div>

    <div class="filters">
        <input type="text" class="filter-search" placeholder="🔍 Buscar nº, segurado, cidade...">

        <input type="date" class="filter-date">
        <input type="date" class="filter-date">

        <button class="filter-btn">Este mês</button>

        <select class="filter-select">
            <option>Todas as seguradoras</option>
        </select>

        <button class="filter-btn active">Todas</button>
        <button class="filter-btn">Sem nota</button>
        <button class="filter-btn">Com OK</button>

        <button class="filter-btn-danger">🗑️ Excluir</button>
    </div>

    <h2>Lista de OS</h2>

    <div class="table-wrap">
        <table class="data-table">
            <thead>
                <tr>
                    <th><input type="checkbox"></th>
                    <th>DATA</th>
                    <th>ASSISTÊNCIA</th>
                    <th>SEGURADORA / SERVIÇO</th>
                    <th>SEGURADO / CIDADE</th>
                    <th>TÉCNICO</th>
                    <th>VISITA</th>
                    <th>MÃO DE OBRA</th>
                    <th>PEÇAS</th>
                    <th>DESLOC.</th>
                    <th>TOTAL</th>
                    <th>NOTA</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

</body>
</html>
